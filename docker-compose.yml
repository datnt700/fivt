version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fivt-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fivt
      POSTGRES_PASSWORD: fivt_dev_password
      POSTGRES_DB: fivt_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fivt']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: fivt_postgres_data
